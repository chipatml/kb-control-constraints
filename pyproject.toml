[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kbcc"
version = "0.1.0"
description = "Turn robot safety constraints in an RDF knowledge graph into validated controller JSON."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rdflib>=7.1,<8",
  "pyshacl>=0.26",
  "pint>=0.24",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
z3 = ["z3-solver>=4.12"]

[project.scripts]
kbcc = "kbcc.cli:main"

[tool.setuptools.packages.find]
include = ["kbcc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
